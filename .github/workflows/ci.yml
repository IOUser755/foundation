name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Detect which languages/projects are present
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_node: ${{ steps.detect.outputs.has_node }}
      has_python: ${{ steps.detect.outputs.has_python }}
      has_go: ${{ steps.detect.outputs.has_go }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Detect languages
        id: detect
        run: |
          # Check for Node.js projects
          if find . -name 'package.json' -not -path '*/node_modules/*' | grep -q .; then
            echo "has_node=true" >> $GITHUB_OUTPUT
            echo "✓ Node.js detected (found package.json)"
          elif [ -d client ] || [ -d server ]; then
            echo "has_node=true" >> $GITHUB_OUTPUT
            echo "✓ Node.js detected (found client/ or server/)"
          else
            echo "has_node=false" >> $GITHUB_OUTPUT
            echo "✗ Node.js not detected"
          fi
          
          # Check for Python projects
          if [ -f requirements.txt ] || [ -f pyproject.toml ]; then
            echo "has_python=true" >> $GITHUB_OUTPUT
            echo "✓ Python detected (found requirements.txt or pyproject.toml)"
          else
            echo "has_python=false" >> $GITHUB_OUTPUT
            echo "✗ Python not detected"
          fi
          
          # Check for Go projects
          if [ -f go.mod ]; then
            echo "has_go=true" >> $GITHUB_OUTPUT
            echo "✓ Go detected (found go.mod)"
          else
            echo "has_go=false" >> $GITHUB_OUTPUT
            echo "✗ Go not detected"
          fi

  # Node.js job - runs if package.json, client/, or server/ exists
  node:
    needs: detect
    if: needs.detect.outputs.has_node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run lint
        run: npm run lint --if-present
        continue-on-error: false
      
      - name: Run typecheck
        run: npm run typecheck --if-present
        continue-on-error: false
      
      - name: Run tests
        run: npm run test --if-present
        continue-on-error: false
      
      - name: Job summary
        if: always()
        run: |
          echo "### Node.js CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Dependencies installed" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Lint, typecheck, and tests executed" >> $GITHUB_STEP_SUMMARY

  # Python job - runs if requirements.txt or pyproject.toml exists
  python:
    needs: detect
    if: needs.detect.outputs.has_python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r requirements.txt || true
        continue-on-error: true
      
      - name: Run tests
        run: pytest -q || true
        continue-on-error: true
      
      - name: Job summary
        if: always()
        run: |
          echo "### Python CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Dependencies installed (soft fail)" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Tests executed (soft fail)" >> $GITHUB_STEP_SUMMARY

  # Go job - runs if go.mod exists
  go:
    needs: detect
    if: needs.detect.outputs.has_go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
      
      - name: Run vet
        run: go vet ./...
      
      - name: Run tests
        run: go test ./...
      
      - name: Job summary
        if: always()
        run: |
          echo "### Go CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Static analysis completed" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Tests executed" >> $GITHUB_STEP_SUMMARY
